spring:
  application:
    name: accounts

datasource:
    url: jdbc:h2:mem:accountdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

h2:
  console:
    enabled: true
    path: /h2-console

jpa:
  hibernate:
    ddl-auto: update
  show-sql: true
  database-platform: org.hibernate.dialect.H2Dialect
  properties:
    hibernate:
      format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info