spring:
  application:
    name: accounts

datasource:
    url: jdbc:postgresql://localhost:5432/accountdb
    username: adminuser
    password: adminpass
    driver-class-name: org.postgresql.Driver

jpa:
  hibernate:
    ddl-auto: validate
  show-sql: true
  database-platform: org.hibernate.dialect.PostgreSQLDialect
  properties:
    hibernate:
      format_sql: true

flyway: 
  enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info